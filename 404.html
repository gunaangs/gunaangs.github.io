<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found · Gunaseelan</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0c10'/%3E%3Cpath d='M20.5 11.5a5.6 5.6 0 1 0 0 9' fill='none' stroke='%23ff7a45' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script>
(function () {
  try {
    var saved = localStorage.getItem("theme");
    var system = window.matchMedia("(prefers-color-scheme: light)").matches
      ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", saved || system);
  } catch (e) {}
})();
</script>
<style>
  .oops {
    min-height: 100svh;
    display: grid;
    place-content: center;
    text-align: center;
    padding: 2rem;
  }
  .oops__code {
    font-family: var(--font-mono);
    font-size: clamp(4rem, 18vw, 8rem);
    font-weight: 600;
    letter-spacing: -0.05em;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  .oops__title {
    font-size: clamp(1.4rem, 4vw, 2rem);
    margin-bottom: 0.75rem;
  }
  .oops__text {
    color: var(--text-mid);
    max-width: 42ch;
    margin: 0 auto 2rem;
  }
</style>
</head>
<body>
  <main class="oops">
    <p class="oops__code">404</p>
    <h1 class="oops__title">This page doesn't exist.</h1>
    <p class="oops__text">
      Either the link is wrong or I moved something. Either way, the front page
      still works.
    </p>
    <p>
      <a class="btn btn--primary" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 18l-6-6 6-6"/></svg>
        Back to the homepage
      </a>
    </p>
  </main>
</body>
</html>
